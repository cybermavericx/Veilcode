[package]
name = "veilcode-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "veilcode-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui-file-dialog = { version = "0.15.0", default-features = false }
veilcode-core = { version = "0.1.0", path = "../veilcode-core" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit"] }
