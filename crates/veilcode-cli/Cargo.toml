[package]
name = "veilcode-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "veilcode"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
rpassword = "7.5.4"
veilcode-core = { version = "0.1.0", path = "../veilcode-core" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
