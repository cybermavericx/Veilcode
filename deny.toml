# cargo-deny configuration (SPEC §10.1). Keys verified for cargo-deny 0.20.2;
# see docs/VERIFY_LOG.md. Never add `wrappers` or widen these lists to get CI
# green: if a banned crate appears, stop and report to the maintainer.

[graph]
# Evaluate the dependency graph for every platform Veilcode ships on or is
# built on in CI, so platform-specific deps are not missed.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

[advisories]
# Fail on yanked crates; flag unmaintained crates anywhere in the graph.
yanked = "deny"
unmaintained = "all"
# D140 (maintainer's choice, 2026-10-19): three "unmaintained" notices for
# crates that no shipped binary compiles. `cargo tree -e normal,build
# --target <t> -i <crate>` prints nothing for x86_64-unknown-linux-gnu,
# x86_64-unknown-linux-musl, x86_64-pc-windows-msvc, x86_64-apple-darwin and
# aarch64-apple-darwin; they enter cargo-deny's merged all-features graph via
# eframe -> egui-winit -> accesskit_winit -> accesskit_unix. Review by
# 2027-01-19 (the date is in each reason; no `expiry` key is used because its
# support in cargo-deny 0.20.2 was not checked).
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained notice (merged into zbus 6); not compiled into any shipped binary (cargo tree on linux-gnu, linux-musl, windows-msvc, darwin); enters via eframe->egui-winit->accesskit_winit->accesskit_unix. Review by 2027-01-19 (D140)." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained notice (merged into zbus 6); not compiled into any shipped binary (cargo tree on linux-gnu, linux-musl, windows-msvc, darwin); enters via eframe->egui-winit->accesskit_winit->accesskit_unix. Review by 2027-01-19 (D140)." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained notice (merged into zbus 6); not compiled into any shipped binary (cargo tree on linux-gnu, linux-musl, windows-msvc, darwin); enters via eframe->egui-winit->accesskit_winit->accesskit_unix. Review by 2027-01-19 (D140)." },
]

[licenses]
# Built from `cargo deny check licenses` output. Our own crates are
# "MIT OR Apache-2.0".
allow = [
    "MIT",
    "Apache-2.0",
    # unicode-ident, via proc-macro2 <- serde_derive/thiserror-impl/zeroize_derive
    "Unicode-3.0",
    # D101 (P6 GUI graph), from `cargo deny check licenses` on 2026-10-14:
    # clipboard-win 5.4.1 and error-code 3.4.0 (Windows clipboard via arboard)
    "BSL-1.0",
    # libloading 0.8.9 (dlopen of X11/Wayland/GL libraries)
    "ISC",
    # foldhash 0.2.0 (via hashbrown <- accesskit, indexmap)
    "Zlib",
]
confidence-threshold = 0.8

# D84: directories -> dirs-sys -> option-ext 0.2.0 is MPL-2.0 (file-level
# copyleft, used unmodified; notice in THIRD_PARTY_NOTICES). Allowed for this
# one crate only; MPL-2.0 stays off the global allow-list.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

# D101: epaint_default_fonts embeds the egui default fonts (Hack, Noto Emoji,
# Ubuntu-Light, emoji-icon-font). The font licences are allowed for this one
# crate only; licence texts are in THIRD_PARTY_NOTICES.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path deps between our own crates (cli -> core from P4) are not wildcards to
# worry about: both crates are `publish = false`, which cargo-deny treats as
# private, so this exempts only their path dependencies.
allow-wildcard-paths = true
# SPEC §10.1: no HTTP, TLS, DNS, websocket, QUIC or URL-opening crates.
deny = [
    { crate = "reqwest", reason = "network: HTTP client (SPEC §10.1)" },
    { crate = "ureq", reason = "network: HTTP client (SPEC §10.1)" },
    { crate = "hyper", reason = "network: HTTP (SPEC §10.1)" },
    { crate = "h2", reason = "network: HTTP/2 (SPEC §10.1)" },
    { crate = "curl", reason = "network: libcurl bindings (SPEC §10.1)" },
    { crate = "isahc", reason = "network: HTTP client (SPEC §10.1)" },
    { crate = "attohttpc", reason = "network: HTTP client (SPEC §10.1)" },
    { crate = "surf", reason = "network: HTTP client (SPEC §10.1)" },
    { crate = "tungstenite", reason = "network: websocket (SPEC §10.1)" },
    { crate = "quinn", reason = "network: QUIC (SPEC §10.1)" },
    { crate = "rustls", reason = "network: TLS (SPEC §10.1)" },
    { crate = "native-tls", reason = "network: TLS (SPEC §10.1)" },
    { crate = "openssl", reason = "network: TLS (SPEC §10.1)" },
    { crate = "hickory-resolver", reason = "network: DNS (SPEC §10.1)" },
    { crate = "trust-dns-resolver", reason = "network: DNS (SPEC §10.1)" },
    { crate = "webbrowser", reason = "opens URLs in the system browser (SPEC §10.1)" },
    { crate = "open", reason = "opens URLs/files via the OS (SPEC §10.1)" },
    { crate = "opener", reason = "opens URLs/files via the OS (SPEC §10.1)" },
]

[sources]
# Only crates.io; no git or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
