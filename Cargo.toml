[workspace]
resolver = "3"
members = ["crates/veilcode-core", "crates/veilcode-cli"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cybermavericx/Veilcode"
rust-version = "1.88"

# Every crate inherits these with `[lints] workspace = true` (cargo >= 1.74).
# Kept alongside the in-file #![forbid(unsafe_code)].
[workspace.lints.rust]
unsafe_code = "forbid"

# SPEC §8 / D18: build the argon2 crates with opt-level = 3 in the dev profile
# so tests using production KDF params stay fast. Crate names come from
# Cargo.lock (argon2 and its hash, blake2); see docs/VERIFY_LOG.md.
[profile.dev.package.argon2]
opt-level = 3

# D42 / S20: the scanner's regex engine is unusably slow unoptimised on hostile
# 5 MiB inputs in debug tests. Crate names from Cargo.lock (regex 1.13.1 and
# its matching engine regex-automata); see docs/VERIFY_LOG.md.
[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

# D92: release binaries are stripped of symbols and built as one LTO unit for
# size. `panic` stays at its default (unwind) so zeroize-on-drop still runs
# while a panic unwinds. Keys and values: cargo profiles reference (VERIFY_LOG
# 2026-10-13).
[profile.release]
strip = true
codegen-units = 1
lto = "fat"
