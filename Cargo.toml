[workspace]
resolver = "3"
members = ["crates/veilcode-core", "crates/veilcode-cli"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cybermavericx/Veilcode"
rust-version = "1.85"

# Every crate inherits these with `[lints] workspace = true` (cargo >= 1.74).
# Kept alongside the in-file #![forbid(unsafe_code)].
[workspace.lints.rust]
unsafe_code = "forbid"

# SPEC §8 / D18: build the argon2 crates with opt-level = 3 in the dev profile
# so tests using production KDF params stay fast. Crate names are taken from
# Cargo.lock once P1 adds argon2. Placeholder only:
#
# [profile.dev.package.<argon2-crate>]
# opt-level = 3
