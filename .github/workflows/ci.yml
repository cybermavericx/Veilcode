# CI for Veilcode (PLAN P0). Every action is pinned by full commit SHA; the
# tag beside it and the lookup URL are recorded in docs/VERIFY_LOG.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45  # P6: plus a release (lto = "fat") GUI build
    # Zero-warnings rule for every build in this job.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup is preinstalled on GitHub's runner images (VERIFY_LOG 2026-10-14).
      # With no argument it installs the toolchain and components pinned in
      # rust-toolchain.toml. No third-party setup action is used (D95).
      - name: install pinned toolchain
        shell: bash
        run: rustup toolchain install --no-self-update && rustup show active-toolchain
      # cargo fmt has no --locked flag (it does not resolve dependencies).
      - name: fmt
        shell: bash
        run: cargo fmt --all -- --check
      - name: clippy
        shell: bash
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test
        shell: bash
        run: cargo test --locked --workspace
      # PLAN P6 acceptance: the GUI release build on all 3 OS. No system
      # packages are needed to build it (VERIFY_LOG 2026-10-14: eframe/glow
      # dlopens X11/Wayland/GL at run time; links only libgcc_s, libm, libc).
      - name: build veilcode-gui (release)
        shell: bash
        run: cargo build --release --locked -p veilcode-gui
      - name: check-offline
        shell: bash
        run: bash scripts/check-offline.sh
      - name: check-test-ids
        shell: bash
        run: bash scripts/check-test-ids.sh

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install pinned toolchain (rustup, D95)
        shell: bash
        run: rustup toolchain install --no-self-update && rustup show active-toolchain
      # Built from crates.io source (crate checksums verified via its own lockfile)
      # instead of cargo-deny-action, which downloads an unverified binary (VERIFY_LOG 2026-10-10).
      - name: install cargo-deny
        shell: bash
        run: cargo install --locked cargo-deny@0.20.2
      - name: cargo deny
        shell: bash
        run: cargo deny --all-features --locked check

  net-audit:
    name: net-audit (strace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install pinned toolchain (rustup, D95)
        shell: bash
        run: rustup toolchain install --no-self-update && rustup show active-toolchain
      # strace + util-linux for the audit; xvfb plus the runtime-only libraries
      # the glow GUI dlopens on X11 (and Wayland), per VERIFY_LOG 2026-10-14
      # and D100. No -dev packages. The Vulkan packages are left out: they are
      # only used by the wgpu renderer, and D96 chose glow.
      - name: install strace, xvfb and GUI runtime libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y strace util-linux xvfb \
            libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 \
            libx11-6 libx11-xcb1 libxcursor1 libxi6 libxrandr2 \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0
      # CLI scenarios (C9) and the GUI under xvfb-run for 10 s (G6).
      - name: net-audit
        shell: bash
        run: bash scripts/net-audit.sh
