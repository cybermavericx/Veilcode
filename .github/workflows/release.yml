# Release workflow (PLAN P5; D90-D93). Pushing a v* tag runs:
#   build   (matrix, read-only)  -> veilcode binaries for Linux musl + Windows MSVC
#   sbom    (read-only)          -> one CycloneDX SBOM per target
#   release (needs both; the only job that can write) -> SHA256SUMS, provenance
#           attestation and a DRAFT release for the maintainer to publish by hand.
# The release job runs no third-party build code (no toolchain, no cargo
# install): it only checks, hashes, attests and uploads files made elsewhere.
# Every action is pinned by full commit SHA; tag, inputs and lookup URL are in
# docs/VERIFY_LOG.md. The tag name only ever reaches shell code through env
# (TAG), never via an expression inside run:.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One release run at a time for the whole repo, so two tag pushes cannot race
# on draft creation. A running release is never cancelled; note that GitHub
# keeps only one *pending* run per group (an older pending one is cancelled).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, x86_64-pc-windows-msvc]
        include:
          # D91: ubuntu-24.04 pinned (ubuntu-latest moves to 26.04 in Nov 2026).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            exe: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: '.exe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TAG: ${{ github.ref_name }}
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.exe }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup is preinstalled on GitHub's runner images (VERIFY_LOG 2026-10-14);
      # with no toolchain argument it installs the one pinned in
      # rust-toolchain.toml, and -t adds the target's std (a no-op for the msvc
      # host). No third-party setup action, no cache (D95).
      - name: install pinned toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install --no-self-update -t "$TARGET" && rustup show active-toolchain
      - name: check tag name
        shell: bash
        run: |
          # The tag becomes part of file names: allow only a safe charset.
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "tag '$TAG' does not look like v<version>" >&2; exit 1 ;;
          esac
          case "$TAG" in
            *[!A-Za-z0-9._-]*) echo "tag '$TAG' has unexpected characters" >&2; exit 1 ;;
          esac
      - name: set path-remap flags (D92)
        shell: bash
        run: |
          # Cargo home resolved the way rustup does (CARGO_HOME, else ~/.cargo); on
          # Windows rustc sees native paths, so use backslashes.
          if [ "$RUNNER_OS" = Windows ]; then
            cargo_home=$(printf '%s' "${CARGO_HOME:-$USERPROFILE/.cargo}" | sed 's|/|\\|g')
          else
            cargo_home=${CARGO_HOME:-$HOME/.cargo}
          fi
          # RUSTFLAGS is split on whitespace, so a path with a space would break it.
          case "$GITHUB_WORKSPACE$cargo_home" in
            *' '*) echo "workspace or cargo home path contains a space" >&2; exit 1 ;;
          esac
          # No /Brepro for MSVC: it is not in Microsoft's documented linker
          # options (VERIFY_LOG 2026-10-13), so Windows builds keep a link timestamp.
          flags="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$cargo_home=/cargo"
          echo "RUSTFLAGS=$flags"
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"
          echo "CARGO_HOME_RESOLVED=$cargo_home" >> "$GITHUB_ENV"
      - name: build
        shell: bash
        run: cargo build --release --locked -p veilcode-cli --target "$TARGET"
      - name: stage and smoke-test
        shell: bash
        run: |
          mkdir -p dist
          out="dist/veilcode-$TAG-$TARGET$EXE"
          cp "target/$TARGET/release/veilcode$EXE" "$out"
          version=$("./$out" --version)
          echo "$version"
          case "$version" in
            'veilcode '*) ;;
            *) echo "unexpected --version output" >&2; exit 1 ;;
          esac
          ls -l dist
      # Also covers the MSVC PDB path: the linker writes it, not rustc, so
      # --remap-path-prefix may not reach it.
      - name: check build paths did not leak (D92)
        shell: bash
        run: bash scripts/check-path-leak.sh "dist/veilcode-$TAG-$TARGET$EXE" "$GITHUB_WORKSPACE" "$CARGO_HOME_RESOLVED"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: dist/veilcode-*
          if-no-files-found: error
          retention-days: 3

  # Separate read-only job (D93, security M1): cargo-cyclonedx is third-party
  # code built from crates.io, so it never runs next to the write token.
  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install pinned toolchain (rustup, D95)
        shell: bash
        run: rustup toolchain install --no-self-update && rustup show active-toolchain
      - name: check tag name
        shell: bash
        run: |
          # Same rule as the build job (this job runs in parallel with it).
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "tag '$TAG' does not look like v<version>" >&2; exit 1 ;;
          esac
          case "$TAG" in
            *[!A-Za-z0-9._-]*) echo "tag '$TAG' has unexpected characters" >&2; exit 1 ;;
          esac
      # Built from crates.io source with its own lockfile (VERIFY_LOG 2026-10-13).
      - name: install cargo-cyclonedx
        shell: bash
        run: cargo install --locked cargo-cyclonedx@0.5.9
      - name: SBOMs (CycloneDX 1.5, one per target)
        shell: bash
        run: |
          # Reproducible timestamp: the tagged commit's time (D92).
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          # cargo-cyclonedx writes next to the manifests, so run it in a scratch
          # export of the tagged tree, never in the checkout.
          scratch="$RUNNER_TEMP/sbom-src"
          mkdir -p "$scratch" sbom
          git archive --format=tar HEAD | tar -x -C "$scratch"
          for t in x86_64-unknown-linux-musl x86_64-pc-windows-msvc; do
            (cd "$scratch" && cargo cyclonedx \
              --manifest-path crates/veilcode-cli/Cargo.toml \
              --format json --spec-version 1.5 \
              --describe binaries --target "$t" --target-in-filename)
            mv "$scratch/crates/veilcode-cli/veilcode_bin_$t.cdx.json" "sbom/veilcode-$TAG-$t.cdx.json"
          done
          # The SBOM must describe the locked graph: fail if the tool touched the lockfile.
          cmp Cargo.lock "$scratch/Cargo.lock"
          ls -l sbom
      - name: check build paths did not leak into the SBOMs
        shell: bash
        run: |
          # Only the checkout and cargo home are checked. The bom-ref values
          # contain the scratch path ($RUNNER_TEMP/sbom-src, outside the
          # workspace); that is a known, accepted, non-secret runner path.
          cargo_home=${CARGO_HOME:-$HOME/.cargo}
          for f in sbom/*.cdx.json; do
            bash scripts/check-path-leak.sh "$f" "$GITHUB_WORKSPACE" "$cargo_home"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-sbom
          path: sbom/veilcode-*.cdx.json
          if-no-files-found: error
          retention-days: 3

  release:
    name: draft release
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Protected environment: the maintainer must approve each run before this
    # job receives its OIDC and write tokens; only v* tags may deploy (D94).
    environment: release
    # Only this job may write. artifact-metadata: write is left out (D93
    # amended): actions/attest needs it only for registry storage records.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      BUILT_SHA: ${{ github.sha }}
      GH_REPO: ${{ github.repository }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
    # No checkout: nothing from the repo runs here.
    steps:
      # build-* matches the two binaries and build-sbom; merge-multiple puts
      # every file straight into dist/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: dist
      - name: check exact file set
        shell: bash
        env:
          WITH_SUMS: 'no'
        run: |
          # Exactly the expected files, nothing else (hidden files included).
          # WITH_SUMS=yes once SHA256SUMS has been written.
          expected="veilcode-$TAG-x86_64-pc-windows-msvc.cdx.json
          veilcode-$TAG-x86_64-pc-windows-msvc.exe
          veilcode-$TAG-x86_64-unknown-linux-musl
          veilcode-$TAG-x86_64-unknown-linux-musl.cdx.json"
          if [ "$WITH_SUMS" = yes ]; then
            expected="$expected
          SHA256SUMS"
          fi
          for f in $expected; do
            test -f "dist/$f" || { echo "missing: dist/$f" >&2; exit 1; }
          done
          actual=$(cd dist && LC_ALL=C ls -A)
          want=$(printf '%s\n' $expected | LC_ALL=C sort)
          if [ "$actual" != "$want" ]; then
            echo "dist/ has unexpected contents:" >&2
            ls -lA dist >&2
            exit 1
          fi
          echo "file set OK"
      - name: restore executable bit
        shell: bash
        run: |
          # Zipped artifacts drop file modes (upload-artifact README). Modes are
          # not part of the sha256, but users get a runnable file.
          chmod 755 "dist/veilcode-$TAG-x86_64-unknown-linux-musl"
          ls -lA dist
      - name: SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum veilcode-* > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: check exact file set (again, before attesting)
        shell: bash
        env:
          WITH_SUMS: 'yes'
        run: |
          # Exactly the expected files, nothing else (hidden files included).
          # WITH_SUMS=yes once SHA256SUMS has been written.
          expected="veilcode-$TAG-x86_64-pc-windows-msvc.cdx.json
          veilcode-$TAG-x86_64-pc-windows-msvc.exe
          veilcode-$TAG-x86_64-unknown-linux-musl
          veilcode-$TAG-x86_64-unknown-linux-musl.cdx.json"
          if [ "$WITH_SUMS" = yes ]; then
            expected="$expected
          SHA256SUMS"
          fi
          for f in $expected; do
            test -f "dist/$f" || { echo "missing: dist/$f" >&2; exit 1; }
          done
          actual=$(cd dist && LC_ALL=C ls -A)
          want=$(printf '%s\n' $expected | LC_ALL=C sort)
          if [ "$actual" != "$want" ]; then
            echo "dist/ has unexpected contents:" >&2
            ls -lA dist >&2
            exit 1
          fi
          echo "file set OK"
      # D90: actions/attest with an explicit subject (no implicit fallback).
      # Subjects: both binaries and both SBOM files.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/veilcode-*
      - name: check the tag still points at the built commit
        shell: bash
        run: |
          # Annotated tags list a peeled "^{}" line (the commit); lightweight
          # tags only the plain line. Prefer the peeled one.
          refs=$(git ls-remote "$REPO_URL" "refs/tags/$TAG" "refs/tags/$TAG^{}")
          echo "$refs"
          remote_sha=$(printf '%s\n' "$refs" | awk -v r="refs/tags/$TAG^{}" '$2 == r {print $1}')
          if [ -z "$remote_sha" ]; then
            remote_sha=$(printf '%s\n' "$refs" | awk -v r="refs/tags/$TAG" '$2 == r {print $1}')
          fi
          if [ "$remote_sha" != "$BUILT_SHA" ]; then
            echo "tag $TAG now points at '$remote_sha', but this run built $BUILT_SHA" >&2
            exit 1
          fi
          echo "tag $TAG -> $BUILT_SHA OK"
      - name: create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=''
          case "$TAG" in *-*) prerelease='--prerelease' ;; esac
          notes="Draft built by .github/workflows/release.yml from tag $TAG. Before use, verify downloads: sha256sum -c --ignore-missing SHA256SUMS, and gh attestation verify <file> --repo $GH_REPO. Full steps, including how to confirm the binary makes no network calls, are in docs/VERIFY_OFFLINE.md."
          # $prerelease is deliberately unquoted: empty or a single flag.
          gh release create "$TAG" dist/* --verify-tag --draft $prerelease \
            --title "Veilcode $TAG" --notes "$notes"
